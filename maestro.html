<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<meta name="robots" content="noindex, nofollow">
<title>Panel maestro — Incubadora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#0F1115;--card:#171A21;--card2:#1E222B;--border:#2A2E38;--text:#ECEDEF;--dim:#8A8F9C;--dim2:#5E6370;
    --accent:#FF7A30;--accent-dim:#3A2A20;--ok:#3DDC97;--ok-dim:#163428;--warn:#F5B942;--warn-dim:#3A3018;
    --bad:#FF5C5C;--bad-dim:#3D1E21;--gray:#6B7080;--r:12px;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font:inherit;color:inherit}
  input,select,textarea{font-size:16px}
  a{color:var(--accent)}
  .hide{display:none!important}
  .wrap{max-width:1180px;margin:0 auto;padding:0 14px calc(60px + var(--safe-b))}
  /* Barra superior */
  .top{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
  .brand{flex:1;min-width:0}
  .brand small{display:block;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .brand b{font-size:17px}
  .ib{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:18px}
  .ib .n{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
  .ib .n.w{background:var(--warn);color:#111}
  @media (hover:hover){.ib:hover,.btn:hover{border-color:#3a4050}}
  /* Tarjetas de resumen */
  h2{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin:22px 2px 10px;font-weight:700}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .k{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;min-width:0}
  .k .l{color:var(--dim);font-size:12px}
  .k .v{font-size:22px;font-weight:750;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .k .s{color:var(--dim);font-size:12px;margin-top:2px}
  .k.wide{grid-column:span 2}
  .bar{height:8px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:8px;position:relative}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:5px}
  .bar i.w{background:var(--warn)} .bar i.b{background:var(--bad)}
  .bar .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.5}
  .pos{color:var(--ok)} .neg{color:var(--bad)} .wr{color:var(--warn)}
  /* Filtros */
  .fil{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
  .fil::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--border);background:var(--card);border-radius:20px;padding:7px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
  .chip.on{border-color:var(--accent);background:var(--accent-dim);color:#fff}
  .search{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:10px;outline:none}
  .search:focus{border-color:var(--accent)}
  /* Lista de clientes */
  .list{display:grid;gap:10px;margin-top:12px}
  @media(min-width:760px){.list{grid-template-columns:repeat(2,1fr)}}
  .cli{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%}
  .cli:active{transform:scale(.995)}
  .dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--gray);box-shadow:0 0 0 3px rgba(107,112,128,.18)}
  .dot.verde{background:var(--ok);box-shadow:0 0 0 3px rgba(61,220,151,.18)}
  .dot.ambar{background:var(--warn);box-shadow:0 0 0 3px rgba(245,185,66,.2)}
  .dot.rojo{background:var(--bad);box-shadow:0 0 0 3px rgba(255,92,92,.22)}
  .cli .b{flex:1;min-width:0}
  .cli .t{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
  .cli .t b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cli .t span{flex:none;font-weight:700}
  .meta{color:var(--dim);font-size:13px;margin-top:2px}
  .why{font-size:13px;margin-top:7px;padding:6px 9px;border-radius:8px;background:var(--card2)}
  .why.rojo{background:var(--bad-dim);color:#FFC2C2} .why.ambar{background:var(--warn-dim);color:#FFE3A6}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--dim)}
  .tag.r{background:var(--bad-dim);color:#FFB3B3} .tag.a{background:var(--warn-dim);color:#FFDD99} .tag.g{background:var(--ok-dim);color:#9FF0C9}
  .empty{color:var(--dim);text-align:center;padding:30px 10px}
  /* Hoja de detalle */
  .sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
  .sheet .hd{border-bottom:1px solid var(--border);background:var(--bg)}
  .sheet .hd .in{max-width:1180px;margin:0 auto;padding:10px 14px 0;padding-top:max(10px,env(safe-area-inset-top))}
  .sheet .row1{display:flex;gap:10px;align-items:center}
  .sheet .row1 .tt{flex:1;min-width:0}
  .sheet .row1 .tt b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:10px 12px;border:0;background:none;color:var(--dim);border-bottom:2px solid transparent;cursor:pointer;font-weight:600;font-size:14px}
  .tab.on{color:var(--text);border-color:var(--accent)}
  .sheet .bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .sheet .bd .in{max-width:1180px;margin:0 auto;padding:14px 14px calc(40px + var(--safe-b))}
  .box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:12px}
  .box h3{margin:0 0 8px;font-size:14px;color:var(--dim);font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(min-width:760px){.grid2.c4{grid-template-columns:repeat(4,1fr)}}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px}
  .kv:last-child{border-bottom:0} .kv span:first-child{color:var(--dim)} .kv span:last-child{text-align:right}
  .reason{display:flex;gap:8px;align-items:flex-start;padding:7px 0;font-size:14px}
  .reason .dot{margin-top:4px;width:9px;height:9px}
  .unit{border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px}
  .unit .t{display:flex;gap:8px;align-items:center}
  .unit .t b{flex:1}
  .steps{display:grid;gap:8px}
  .step{display:flex;gap:10px;align-items:center;font-size:14px}
  .step i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;background:var(--card2);color:var(--dim);border:1px solid var(--border)}
  .step.ok i{background:var(--ok-dim);color:var(--ok);border-color:transparent}
  .item{padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
  .item:last-child{border-bottom:0}
  .item .t{display:flex;justify-content:space-between;gap:10px}
  .item .t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .t small{flex:none;color:var(--dim)}
  .item p{margin:3px 0 0;color:var(--dim);font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .btn{border:1px solid var(--border);background:var(--card2);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;min-height:42px}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#111}
  .btn.danger{background:var(--bad-dim);border-color:#5a2a2e;color:#FFC2C2}
  .btn.okb{background:var(--ok-dim);border-color:#235a43;color:#9FF0C9}
  .btn:disabled{opacity:.5;cursor:default}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .ctl{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
  .ctl:last-child{border-bottom:0}
  .ctl .x{flex:1;min-width:0} .ctl .x b{display:block;font-size:15px} .ctl .x small{color:var(--dim)}
  .sw{position:relative;width:50px;height:30px;flex:none}
  .sw input{opacity:0;width:0;height:0}
  .sw span{position:absolute;inset:0;border-radius:20px;background:#3a3f4b;transition:.2s;cursor:pointer}
  .sw span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
  .sw input:checked+span{background:var(--ok)}
  .sw input:checked+span:before{transform:translateX(20px)}
  .sw input:disabled+span{opacity:.45}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  th{color:var(--dim);font-weight:600;font-size:12px}
  td.n,th.n{text-align:right;white-space:nowrap}
  .scroll-x{overflow-x:auto}
  /* Modales */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:760px){.modal{align-items:center}}
  .modal .mc{background:var(--card);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column}
  @media(min-width:760px){.modal .mc{border-radius:16px}}
  .modal .mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
  .modal .mh b{flex:1;font-size:16px}
  .modal .mb{padding:14px 16px calc(16px + var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch}
  label.f{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
  .inp{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;outline:none}
  .inp:focus{border-color:var(--accent)}
  textarea.inp{min-height:90px;resize:vertical}
  .chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px}
  .chk input{width:20px;height:20px;accent-color:var(--accent)}
  .msg{margin-top:10px;font-size:14px;padding:9px 11px;border-radius:9px}
  .msg.err{background:var(--bad-dim);color:#FFC2C2} .msg.ok{background:var(--ok-dim);color:#9FF0C9}
  /* Chat */
  .chat{display:flex;flex-direction:column;gap:6px}
  .bub{max-width:86%;padding:8px 11px;border-radius:12px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
  .bub.u{align-self:flex-start;background:var(--card2);border-bottom-left-radius:4px}
  .bub.a{align-self:flex-end;background:#2B3A33;border-bottom-right-radius:4px}
  .bub small{display:block;color:var(--dim);font-size:11px;margin-top:3px}
  .day{align-self:center;color:var(--dim);font-size:12px;margin:8px 0}
  /* Avisos */
  .al{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
  .al:last-child{border-bottom:0}
  .al .dot{margin-top:5px}
  .al b{display:block;font-size:14px} .al span{font-size:14px}
  /* Gráfica mini */
  .spark{display:flex;align-items:flex-end;gap:2px;height:54px;margin-top:8px}
  .spark i{flex:1;background:var(--accent);opacity:.85;border-radius:2px 2px 0 0;min-height:2px}
  .spark i.z{background:var(--border)}
  /* Acceso */
  .login{max-width:380px;margin:12vh auto 0;padding:0 16px}
  .toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:#22262F;border:1px solid var(--border);padding:10px 16px;border-radius:10px;z-index:90;font-size:14px;max-width:92vw}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--dim2);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .note{font-size:13px;color:var(--dim);margin-top:6px}
</style>
</head>
<body>

<!-- Acceso -->
<div id="vLogin" class="login hide">
  <div style="color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Incubadora</div>
  <h1 style="margin:4px 0 18px;font-size:24px">Panel maestro</h1>
  <form id="fLogin" class="box">
    <label class="f" for="lEmail">Correo</label>
    <input class="inp" id="lEmail" type="email" autocomplete="username" required>
    <label class="f" for="lPass">Contraseña</label>
    <input class="inp" id="lPass" type="password" autocomplete="current-password" required>
    <button class="btn pri" style="width:100%;margin-top:14px" type="submit">Entrar</button>
    <div id="lMsg"></div>
  </form>
</div>

<!-- Panel -->
<div id="vApp" class="hide">
  <div class="top"><div class="in">
    <div class="brand"><small>Incubadora</small><b>Panel maestro</b></div>
    <button class="ib" id="bAvisos" title="Avisos" aria-label="Avisos">🔔<span class="n hide" id="nAvisos"></span></button>
    <button class="ib" id="bRefrescar" title="Actualizar" aria-label="Actualizar">↻</button>
    <button class="ib" id="bAjustes" title="Ajustes" aria-label="Ajustes">⚙︎</button>
  </div></div>

  <div class="wrap">
    <h2>Resumen</h2>
    <div class="kpis" id="kpis"><div class="k wide"><span class="spin"></span> Cargando…</div></div>

    <h2>Clientes</h2>
    <div class="fil" id="filtros"></div>
    <input class="search" id="buscar" type="search" placeholder="Buscar cliente…" autocomplete="off">
    <div class="list" id="lista"></div>
    <div style="margin-top:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <label class="chk" style="margin:0"><input type="checkbox" id="verOcultos"> Mostrar demos y pruebas</label>
      <small class="note" id="actualizado"></small>
    </div>
  </div>
</div>

<!-- Detalle de cliente -->
<div id="sheet" class="sheet hide" role="dialog" aria-modal="true">
  <div class="hd"><div class="in">
    <div class="row1">
      <button class="ib" id="sCerrar" aria-label="Regresar">←</button>
      <span class="dot" id="sDot"></span>
      <div class="tt"><b id="sNombre"></b><small class="meta" id="sSub"></small></div>
    </div>
    <div class="tabs" id="sTabs"></div>
  </div></div>
  <div class="bd" id="sBody"><div class="in" id="sIn"></div></div>
</div>

<div id="modal" class="modal hide"><div class="mc">
  <div class="mh"><b id="mTit"></b><button class="ib" id="mCerrar" aria-label="Cerrar">✕</button></div>
  <div class="mb" id="mBody"></div>
</div></div>

<script>
(function(){
  const SB_URL = 'https://ytxnmscxyjttqftmznqj.supabase.co';
  const SB_KEY = 'sb_publishable_T3LJo-8teMIkimAtHitGWA_XKjzDBP5';
  const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = v => Number(v || 0);
  const mxn = v => '$' + num(v).toLocaleString('es-MX', { maximumFractionDigits: num(v) % 1 && Math.abs(num(v)) < 1000 ? 2 : 0 });
  const ent = v => num(v).toLocaleString('es-MX');
  const TZ = 'America/Mexico_City';
  const fecha = d => d ? new Date(String(d).length === 10 ? d + 'T12:00:00' : d).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', timeZone: TZ }) : '—';
  const fechaHora = d => d ? new Date(d).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: TZ }) : '—';
  const hace = d => { if (!d) return 'nunca'; const m = (Date.now() - new Date(d)) / 60000; if (m < 60) return 'hace ' + Math.max(1, Math.round(m)) + ' min'; if (m < 1440) return 'hace ' + Math.round(m / 60) + ' h'; return 'hace ' + Math.round(m / 1440) + ' d'; };
  const hoyMX = () => new Date().toLocaleDateString('en-CA', { timeZone: TZ });
  const ESTADOS = { activo: 'Activo', pausado: 'Agente pausado', suspendido: 'Suspendido', cancelado: 'Canceló', pendiente_conexion: 'Falta conectar', pendiente_entrenamiento: 'Falta entrenar', demo: 'Demo' };
  const SALUD = { rojo: 'Atención urgente', ambar: 'Revisar', verde: 'Todo bien', gris: 'Suspendido / apagado' };

  let D = null, filtro = 'todos', cli = null, det = null, tab = 'resumen', unidadSel = null, cargando = false;

  function toast(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 3200); }
  async function rpc(fn, args) { const r = await sb.rpc(fn, args || {}); if (r.error) throw new Error(r.error.message); return r.data; }

  // ===== Acceso =====
  async function arrancar() {
    const { data } = await sb.auth.getSession();
    if (!data.session) { vista('login'); return; }
    try { await cargar(); vista('app'); n8nAlDia(); }
    catch (e) {
      if (/no autorizado/i.test(e.message)) { vista('login'); $('lMsg').innerHTML = '<div class="msg err">Esta cuenta no es de administrador.</div>'; }
      else { vista('app'); $('kpis').innerHTML = '<div class="k wide"><div class="msg err">No pude cargar: ' + esc(e.message) + '</div></div>'; }
    }
  }
  function vista(v) { $('vLogin').classList.toggle('hide', v !== 'login'); $('vApp').classList.toggle('hide', v !== 'app'); }
  $('fLogin').addEventListener('submit', async ev => {
    ev.preventDefault(); $('lMsg').innerHTML = '';
    const { error } = await sb.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPass').value });
    if (error) { $('lMsg').innerHTML = '<div class="msg err">Correo o contraseña incorrectos.</div>'; return; }
    arrancar();
  });

  // ===== Datos =====
  async function cargar() {
    if (cargando) return; cargando = true;
    try {
      D = await rpc('maestro_datos', { p_ocultos: $('verOcultos').checked });
      pintarResumen(); pintarFiltros(); pintarLista(); pintarCampana();
      $('actualizado').textContent = 'Actualizado ' + fechaHora(D.resumen.actualizado);
      if (cli) { const c = D.clientes.find(x => x.key === cli.key); if (c) cli = c; }
    } finally { cargando = false; }
  }

  // Lee n8n en vivo si la última lectura tiene más de 30 min (necesita la clave en Supabase)
  let n8nEstado = null;
  async function n8nAlDia(forzar) {
    const ult = D && D.n8n && D.n8n.leido_en ? new Date(D.n8n.leido_en) : null;
    if (!forzar && ult && Date.now() - ult < 30 * 60000) return;
    try {
      const { data: s } = await sb.auth.getSession();
      const r = await fetch(SB_URL + '/functions/v1/maestro-n8n', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + s.session.access_token } });
      const j = await r.json();
      n8nEstado = j;
      if (j.ok) { await cargar(); if (forzar) toast('n8n: ' + ent(j.ejecuciones) + ' ejecuciones este periodo'); }
      else { pintarResumen(); if (forzar) toast(j.motivo === 'sin_clave' ? 'Falta guardar la clave de n8n en Supabase' : 'n8n no respondió (' + j.motivo + ')'); }
    } catch (e) { if (forzar) toast('No pude leer n8n'); }
  }

  function pintarResumen() {
    const r = D.resumen, n = D.n8n, c = D.config;
    const pct = n ? Math.min(100, Math.round(100 * n.ejecuciones / n.tope)) : 0;
    const proyPct = n ? Math.min(100, Math.round(100 * n.proyeccion / n.tope)) : 0;
    const n8nCls = !n ? '' : (n.proyeccion > n.tope || n.ejecuciones >= c.n8n_alerta) ? 'b' : (n.proyeccion > c.n8n_alerta ? 'w' : '');

        <div class="s">${ent(r.karina.calientes)} calientes · ${ent(r.karina.abrieron_liga_mes)} abrieron la liga de pago</div></div>

        ${n ? `<div class="v ${n8nCls === 'b' ? 'neg' : n8nCls === 'w' ? 'wr' : ''}">${ent(n.ejecuciones)} <span style="font-size:14px;color:var(--dim);font-weight:500">de ${ent(n.tope)}</span></div>

  function contar(f) {
    const cs = D.clientes;
    if (f === 'todos') return cs.length;
    if (f === 'riesgo') return cs.filter(c => num(c.riesgo) >= 30).length;
    if (f === 'cobro') return cs.filter(c => c.proximo && diasA(c.proximo) <= 7 && c.tipo === 'medida').length;
    return cs.filter(c => c.salud === f).length;
  }
  const diasA = d => Math.round((new Date(d + 'T12:00:00') - new Date(hoyMX() + 'T12:00:00')) / 864e5);
  function pintarFiltros() {
    const F = [['todos', 'Todos'], ['rojo', '🔴 Urgente'], ['ambar', '🟡 Revisar'], ['verde', '🟢 Bien'], ['gris', '⚪ Suspendidos'], ['riesgo', '⚠️ Riesgo de irse'], ['cobro', '💵 Cobro en 7 días']];
    $('filtros').innerHTML = F.map(([k, t]) => `<button class="chip ${filtro === k ? 'on' : ''}" data-f="${k}">${t} · ${contar(k)}</button>`).join('');
    $('filtros').querySelectorAll('.chip').forEach(b => b.onclick = () => { filtro = b.dataset.f; pintarFiltros(); pintarLista(); });
  }
  function pintarLista() {
    const q = $('buscar').value.trim().toLowerCase();
    let cs = D.clientes.filter(c => {
      if (q && !(c.nombre.toLowerCase().includes(q) || c.unidades.some(u => u.nombre.toLowerCase().includes(q)))) return false;
      if (filtro === 'todos') return true;
      if (filtro === 'riesgo') return num(c.riesgo) >= 30;
      if (filtro === 'cobro') return c.proximo && diasA(c.proximo) <= 7 && c.tipo === 'medida';
      return c.salud === filtro;
    });
    if (!cs.length) { $('lista').innerHTML = '<div class="empty">Sin clientes en este filtro.</div>'; return; }
    $('lista').innerHTML = cs.map(c => {
      const us = c.unidades, u0 = us[0];
      const rojos = us.flatMap(u => u.rojos || []), amar = us.flatMap(u => u.amarillos || []);
      const why = c.salud === 'gris' ? (u0.grupo_motivo || ESTADOS[u0.estado] || 'Apagado') : (rojos[0] || amar[0] || '');
      const in7 = us.reduce((a, u) => a + num(u.uso.in_7d), 0);
      const dc = c.proximo ? diasA(c.proximo) : null;
      const cobro = c.tipo === 'autoservicio' ? 'Stripe · renueva ' + fecha(c.proximo) : (dc === null ? 'Sin fecha de cobro' : dc < 0 ? '<span class="neg">Vencido ' + fecha(c.proximo) + '</span>' : 'Cobro ' + fecha(c.proximo) + (dc <= 3 ? ' <span class="wr">(' + (dc === 0 ? 'hoy' : 'en ' + dc + ' d') + ')</span>' : ''));
      const riesgo = num(c.riesgo) >= 60 ? '<span class="tag r">Riesgo alto de irse</span>' : num(c.riesgo) >= 30 ? '<span class="tag a">Riesgo medio</span>' : '';
      const extra = (rojos.length + amar.length) > 1 ? `<span class="tag">+${rojos.length + amar.length - 1} más</span>` : '';
      return `<button class="cli" data-k="${esc(c.key)}">
        <span class="dot ${c.salud}"></span>
        <div class="b">
          <div class="t"><b>${esc(c.nombre)}</b><span>${mxn(c.cuota)}<small style="color:var(--dim);font-weight:500">/mes</small></span></div>
          <div class="meta">${c.tipo === 'autoservicio' ? 'Autoservicio · ' + esc(u0.plan) : 'A la medida'}${us.length > 1 ? ' · ' + us.length + ' números' : ''} · ${cobro}</div>
          ${why ? `<div class="why ${c.salud}">${esc(why)}</div>` : ''}
          <div class="tags"><span class="tag">${ent(in7)} mensajes en 7 días</span>
            <span class="tag ${num(c.margen_mes) >= 0 ? 'g' : 'r'}">Utilidad ${mxn(c.margen_mes)}</span>${riesgo}${extra}</div>
        </div></button>`;
    }).join('');
    $('lista').querySelectorAll('.cli').forEach(b => b.onclick = () => abrir(b.dataset.k));
  }
  $('buscar').addEventListener('input', pintarLista);
  $('verOcultos').addEventListener('change', () => cargar().catch(e => toast(e.message)));

  function pintarCampana() {
    const a = D.avisos || [], r = a.filter(x => x.nivel === '2').length;

  }
  $('bAvisos').onclick = () => {
    const a = (D.avisos || []).slice().sort((x, y) => (y.nivel - x.nivel) || x.cliente.localeCompare(y.cliente));
    abrirModal('Avisos (' + a.length + ')', a.length ? a.map(x => `<div class="al" data-k="${esc(x.key || '')}"><span class="dot ${x.nivel === '2' ? 'rojo' : 'ambar'}"></span><div><b>${esc(x.cliente)}</b><span>${esc(x.texto)}</span></div></div>`).join('') : '<div class="empty">Todo en orden. 👌</div>');
    $('mBody').querySelectorAll('.al').forEach(e => e.onclick = () => { if (e.dataset.k) { cerrarModal(); abrir(e.dataset.k); } else if (/n8n/.test(e.textContent)) { cerrarModal(); modalN8n(); } });
  };
  $('bRefrescar').onclick = async () => { $('bRefrescar').innerHTML = '<span class="spin"></span>'; try { await cargar(); if (cli) await cargarDetalle(); n8nAlDia(true); } catch (e) { toast(e.message); } $('bRefrescar').textContent = '↻'; };

  // ===== Detalle =====
  const TABS = [['resumen', 'Resumen'], ['chats', 'Pláticas'], ['citas', 'Citas y pedidos'], ['avisos', 'Avisos al dueño'], ['cobranza', 'Cobranza'], ['uso', 'Uso y costos'], ['alta', 'Proceso de alta'], ['control', 'Controles'], ['usuarios', 'Usuarios'], ['negocio', 'Su negocio'], ['bitacora', 'Bitácora']];
  async function abrir(key) {
    cli = D.clientes.find(c => c.key === key); if (!cli) return;
    tab = 'resumen'; unidadSel = null; det = null;

  function pintarCabecera() {

  function tResumen() {
    const us = unidades();

    const mx = Math.max(1, ...dias.map(x => x[1]));
    const riesgo = Math.max(0, ...us.map(u => num(u.riesgo && u.riesgo.puntos)));
    const razonesR = [...new Set(us.flatMap(u => (u.riesgo && u.riesgo.razones) || []))];
    return `
      <div class="grid2 c4">
        <div class="k"><div class="l">Paga</div><div class="v">${mxn(cli.cuota)}</div><div class="s">${cli.tipo === 'autoservicio' ? 'Stripe' : esc(us[0].forma_pago || 'transferencia')}</div></div>
        <div class="k"><div class="l">Utilidad del mes</div><div class="v ${num(cli.margen_mes) >= 0 ? 'pos' : 'neg'}">${mxn(cli.margen_mes)}</div><div class="s">Costos ${mxn(cli.costo_mes)}</div></div>
        <div class="k"><div class="l">Mensajes 7 días</div><div class="v">${ent(us.reduce((a, u) => a + num(u.uso.in_7d), 0))}</div><div class="s">semana anterior ${ent(us.reduce((a, u) => a + num(u.uso.in_prev7d), 0))}</div></div>
        <div class="k"><div class="l">Riesgo de irse</div><div class="v ${riesgo >= 60 ? 'neg' : riesgo >= 30 ? 'wr' : 'pos'}">${riesgo >= 60 ? 'Alto' : riesgo >= 30 ? 'Medio' : 'Bajo'}</div><div class="s">${riesgo} de 100</div></div>
      </div>
      ${razonesR.length ? `<div class="box" style="margin-top:12px"><h3>Por qué se podría ir</h3>${razonesR.map(r => `<div class="reason"><span class="dot ambar"></span><span>${esc(r)}</span></div>`).join('')}</div>` : ''}
      <div class="box" style="margin-top:12px"><h3>Semáforo por número</h3>
        ${us.map(u => `<div class="unit"><div class="t"><span class="dot ${u.salud}"></span><b>${esc(u.nombre)}</b><small class="meta">${esc(ESTADOS[u.estado] || u.estado)}</small></div>
          ${(u.rojos || []).map(r => `<div class="reason"><span class="dot rojo"></span><span>${esc(r)}</span></div>`).join('')}
          ${(u.amarillos || []).map(r => `<div class="reason"><span class="dot ambar"></span><span>${esc(r)}</span></div>`).join('')}
          ${!(u.rojos || []).length && !(u.amarillos || []).length ? `<div class="reason"><span class="dot ${u.salud === 'gris' ? '' : 'verde'}"></span><span>${u.salud === 'gris' ? esc(u.grupo_motivo || ESTADOS[u.estado]) : 'Todo funciona bien'}</span></div>` : ''}
          <div class="tags">

            <span class="tag">Último mensaje ${hace(u.uso.ultimo_in)}</span>

          </div></div>`).join('')}
      </div>
      <div class="box"><h3>Mensajes que recibe por día (30 días)</h3>
        <div class="spark">${dias.map(([d, n]) => `<i class="${n ? '' : 'z'}" style="height:${Math.max(3, Math.round(100 * n / mx))}%" title="${d}: ${n}"></i>`).join('')}</div>
        <div class="meta" style="display:flex;justify-content:space-between"><span>${fecha(dias[0][0])}</span><span>máx ${mx}/día</span><span>hoy</span></div>
      </div>`;
  }

        ${manual ? kv('Suspensión automática', u0.auto_suspender ? 'Sí, ' + u0.dias_gracia + ' días después del vencimiento' : 'No') : kv('Si falla la tarjeta', 'Stripe reintenta y se suspende al vencer la gracia')}
        ${u0.gracia_hasta ? kv('Gracia hasta', '<span class="neg">' + fechaHora(u0.gracia_hasta) + '</span>') : ''}
        ${kv('Cobrado este mes', mxn(cli.cobrado_mes))}
        ${kv('Cobrado en total', mxn(cli.cobrado_total))}
        <div class="btns" style="margin-top:12px">

    el.disabled = true;
    try { await fn(); toast('Listo'); await recargarTodo(true); }
    catch (e) { if (prev !== null) el.checked = prev; toast(e.message); el.disabled = false; }
  }

      ${det2.length ? '<h3 style="font-size:14px;color:var(--dim);margin:16px 0 6px">Por flujo</h3>' + det2.map(([k, v]) => kv(esc(k), ent(v))).join('') : ''}
      ${sinClave ? `<div class="box" style="margin-top:16px"><h3>Para verlo en vivo</h3>
        <ol style="margin:0;padding-left:18px;font-size:14px;line-height:1.6">
          <li>En n8n: <b>Settings → n8n API → Create an API key</b>. Copia la clave.</li>
          <li>En Supabase: <b>Edge Functions → Secrets → Add new secret</b>. Nombre <code>N8N_API_KEY</code>, valor: la clave. Guardar.</li>
          <li>Regresa aquí y toca <b>Leer ahora</b>.</li></ol></div>` : ''}
      <button class="btn pri" style="width:100%;margin-top:14px" id="bLeerN8n">Leer ahora</button>`);
    $('bLeerN8n').onclick = async () => { $('bLeerN8n').innerHTML = '<span class="spin"></span>'; await n8nAlDia(true); cerrarModal(); };
  }

  $('bAjustes').onclick = () => {
    const c = D.config;
    abrirModal('Ajustes de costos', `<form id="fAj">
      <label class="f">Costo mensual de n8n (MXN)</label><input class="inp" name="n8n_costo_mes_mxn" inputmode="decimal" value="${c.n8n_costo_mes_mxn}">
      <label class="f">Ejecuciones incluidas en tu plan</label><input class="inp" name="n8n_tope" inputmode="numeric" value="${c.n8n_tope}">
      <label class="f">Avisarme al llegar a</label><input class="inp" name="n8n_alerta" inputmode="numeric" value="${c.n8n_alerta}">
      <label class="f">Día en que se reinician las ejecuciones</label><input class="inp" name="n8n_dia_corte" type="number" min="1" max="28" value="${c.n8n_dia_corte}">
      <label class="f">Costo por plantilla de aviso (utilidad, MXN)</label><input class="inp" name="plantilla_utility_mxn" inputmode="decimal" value="${c.plantilla_utility_mxn}">
      <label class="f">Costo por plantilla de seguimiento (marketing, MXN)</label><input class="inp" name="plantilla_marketing_mxn" inputmode="decimal" value="${c.plantilla_marketing_mxn}">
      <button class="btn pri" style="width:100%;margin-top:16px" type="submit">Guardar</button>
      <button class="btn" style="width:100%;margin-top:10px" type="button" id="bSalir">Cerrar sesión</button><div id="aMsg"></div></form>`);
    $('fAj').onsubmit = async ev => {
      ev.preventDefault(); const p = {}; new FormData(ev.target).forEach((v, k) => p[k] = v);
      try { await rpc('maestro_guardar_config', { p }); cerrarModal(); toast('Ajustes guardados'); await cargar(); }
      catch (e) { $('aMsg').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; }
    };
    $('bSalir').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  };

  // ===== Modal =====
  let modalAlCerrar = null, modalConHistoria = false;
  function abrirModal(t, html) {
    $('mTit').textContent = t; $('mBody').innerHTML = html; $('mBody').scrollTop = 0;
    if ($('modal').classList.contains('hide')) { history.pushState({ m: 1 }, ''); modalConHistoria = true; }
    $('modal').classList.remove('hide'); modalAlCerrar = null;
  }
  function cerrarModal(desdeHistoria) {
    if ($('modal').classList.contains('hide')) return;
    $('modal').classList.add('hide');
    const f = modalAlCerrar; modalAlCerrar = null;
    if (!desdeHistoria && modalConHistoria) { modalConHistoria = false; ignorarPop = true; history.back(); } else modalConHistoria = false;
    if (f && desdeHistoria) f();
  }
  $('mCerrar').onclick = () => { const f = modalAlCerrar; modalAlCerrar = null; cerrarModal(); if (f) f(); };
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) $('mCerrar').onclick(); });

  // Se refresca solo cada 5 minutos con la pestaña visible
  setInterval(() => { if (document.visibilityState === 'visible' && D && $('modal').classList.contains('hide')) cargar().catch(() => {}); }, 5 * 60000);

  window.__maestro = { pintarConDatos: d => { D = d; vista('app'); pintarResumen(); pintarFiltros(); pintarLista(); pintarCampana(); }, abrirConDetalle: (k, dd) => { cli = D.clientes.find(c => c.key === k); det = dd; tab = 'resumen'; $('sheet').classList.remove('hide'); pintarCabecera(); pintarTab(); }, setTab: t => { tab = t; pintarCabecera(); pintarTab(); } };
  arrancar();
})();
</script>
</body>
</html>
